[package]
name = "emu"
version = "1.3.0"
edition = "2024"
description = "A terminal user interface for managing Android emulators and iOS simulators with a lazygit-inspired design"
repository = "https://github.com/wasabeef/emu"
license = "MIT OR Apache-2.0"
default-run = "emu"
autobins = false
keywords = ["android", "ios", "emulator", "simulator", "tui"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
test-utils = ["dep:rand"]

[dependencies]
# TUI Framework
ratatui = "0.30"
crossterm = "0.29"

# Async Runtime
tokio = { version = "1.53", features = ["full"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive", "env"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"
color-eyre = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Utility
dirs = "7.0"
which = "8.0"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
object = { version = "=0.37.3", default-features = false, features = ["read_core", "macho"] }
# For mock implementations
async-trait = "0.1"
rand = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
mockall = "0.15"
criterion = "0.8"
futures = "0.3"
rand = "0.10"
jsonschema = { version = "0.56.0", default-features = false }

[[bin]]
name = "emu"
path = "src/main.rs"

[[bin]]
name = "debug-avd"
path = "src/bin/debug_avd.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[lints.clippy]
collapsible_if = "allow"
