# Lefthook configuration for Emu project
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    format-rs:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

    format-prettier:
      glob: "*.{js,ts,md,json,yml,yaml}"
      run: bun x prettier --write {staged_files}
      stage_fixed: true

    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

pre-push:
  parallel: false
  commands:
    test:
      run: RUST_TEST_THREADS=1 cargo test --bins --tests --features test-utils
