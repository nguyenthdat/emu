[package]
name = "emu-frida-worker"
version = "0.1.0"
edition = "2024"
description = "Isolated native Frida dynamic instrumentation worker for Emu"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "emu-frida-worker"
path = "src/main.rs"
